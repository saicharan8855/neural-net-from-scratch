[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralnet"
version = "0.1.0"
description = "A neural network built from scratch using only NumPy"
requires-python = ">=3.8"
dependencies = [
    "numpy",
]

[tool.setuptools]
packages = ["neuralnet"]